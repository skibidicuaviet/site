<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Cá Nhân - Tên Của Bạn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: white;
            border: 4px solid white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .title {
            color: #667eea;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .bio {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .info {
            text-align: left;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .info p {
            margin: 8px 0;
            color: #555;
            font-size: 14px;
        }

        .info strong {
            color: #333;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .social-link {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 14px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .social-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="avatar">👤</div>
        <h1>Tên Của Bạn</h1>
        <p class="title">Học Sinh / Sinh Viên</p>
        <p class="bio">Xin chào! Tôi là một người yêu thích học tập và khám phá những điều mới mẻ. Rất vui được biết bạn! 😊</p>
        
        <div class="info">
            <p><strong>📅 Ngày sinh:</strong> 01/01/200X</p>
            <p><strong>📍 Nơi ở:</strong> Hà Nội, Việt Nam</p>
            <p><strong>🎓 Học tại:</strong> Tên trường của bạn</p>
            <p><strong>❤️ Sở thích:</strong> Đọc sách, học tập, nghe nhạc</p>
        </div>

        <div class="social-links">
            <a href="#" class="social-link">📧 Email</a>
            <a href="#" class="social-link">📘 Facebook</a>
            <a href="#" class="social-link">📸 Instagram</a>
        </div>
    </div>
</body>
</html>
